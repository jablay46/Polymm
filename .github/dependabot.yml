version: 2
updates:
  # Actions are pinned to commit SHAs in ci.yml; Dependabot is what keeps
  # them current (a pinned SHA never updates on its own).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
