name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]   # mingguan: CVE baru muncul tanpa ada commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        extras: ["", "--extra chain"]      # tanpa dan dengan extra (aturan #7)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev ${{ matrix.extras }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Pastikan extra chain benar-benar terpasang
        if: matrix.extras != ''
        run: uv run python -c "import py_clob_client, eth_account, eth_utils, poly_eip712_structs"
      - run: uv run pytest --cov -rs

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }            # scan seluruh riwayat
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # Repo config is ".gitleaks.toml" (dot-prefixed); the action only
          # auto-detects "gitleaks.toml", so point it explicitly.
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv export --locked --no-hashes --no-emit-project --extra chain -o /tmp/req.txt
      - run: uvx pip-audit --disable-pip --no-deps -r /tmp/req.txt
